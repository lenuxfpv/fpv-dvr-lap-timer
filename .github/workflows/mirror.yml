name: Mirror to public repo
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pip install git-filter-repo
 
      - name: Mirror with author info and username replaced
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone --bare "https://x-access-token:${SRC_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          # Text replaced in every file and commit message (one rule per line: old==>new)
          printf '%s\n' 'regex:(?i)lenuxfpv==>lenuxfpv' > ../replacements.txt
          git filter-repo --force \
            --name-callback 'return b"LenuxFPV"' \
            --email-callback 'return b"342138357+lenuxfpv@users.noreply.github.com"' \
            --replace-text ../replacements.txt \
            --replace-message ../replacements.txt
          git push --mirror "https://x-access-token:${DEST_TOKEN}@github.com/lenuxfpv/fpv-dvr-lap-timer.git"

      # git only carries the code and tags, not GitHub releases, so copy them across. Only releases newer than the
      # newest one already on the public repo are copied (older ones were removed on purpose). Needs PUBLIC_REPO_TOKEN
      # to be allowed to write releases (fine-grained: Contents read/write).
      - name: Copy new releases to the public repo
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          SRC="${{ github.repository }}"
          DEST="lenuxfpv/fpv-dvr-lap-timer"
          newest=$(GH_TOKEN="$DEST_TOKEN" gh release list -R "$DEST" --limit 200 --json tagName --jq '.[].tagName' | sort -V | tail -1)
          echo "Newest release on $DEST: ${newest:-none}"
          # oldest first, so the newest ends up marked Latest
          tags=$(GH_TOKEN="$SRC_TOKEN" gh release list -R "$SRC" --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' | sort -V)
          for tag in $tags; do
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -1)" = "$newest" ]; then
              continue
            fi
            echo "Copying release $tag"
            mkdir -p "rel/$tag"
            GH_TOKEN="$SRC_TOKEN" gh release download "$tag" -R "$SRC" -D "rel/$tag"
            title=$(GH_TOKEN="$SRC_TOKEN" gh release view "$tag" -R "$SRC" --json name --jq '.name')
            body=$(GH_TOKEN="$SRC_TOKEN" gh release view "$tag" -R "$SRC" --json body --jq '.body')
            GH_TOKEN="$DEST_TOKEN" gh release create "$tag" rel/"$tag"/* -R "$DEST" --verify-tag --title "${title:-$tag}" --notes "$body"
          done

      # Keep the public Releases page to the newest release only. This deletes the older releases, not their
      # git tags. It runs after the copy step, so the newest release is on the public repo before anything is deleted.
      - name: Prune old releases on the public repo
        env:
          DEST_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          DEST="lenuxfpv/fpv-dvr-lap-timer"
          tags=$(GH_TOKEN="$DEST_TOKEN" gh release list -R "$DEST" --limit 200 --json tagName --jq '.[].tagName' | sort -V)
          newest=$(printf '%s\n' "$tags" | tail -1)
          if [ -z "$newest" ]; then
            echo "No releases on $DEST, nothing to prune"
            exit 0
          fi
          echo "Keeping $newest"
          for tag in $tags; do
            if [ "$tag" != "$newest" ]; then
              echo "Deleting release $tag (the tag stays)"
              GH_TOKEN="$DEST_TOKEN" gh release delete "$tag" -R "$DEST" --yes
            fi
          done
