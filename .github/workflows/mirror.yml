name: Mirror to public repo
 
on:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pip install git-filter-repo
 
      - name: Mirror with author info and username replaced
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone --bare "https://x-access-token:${SRC_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          # Text replaced in every file and commit message (one rule per line: old==>new)
          printf '%s\n' 'regex:(?i)lenuxfpv==>lenuxfpv' > ../replacements.txt
          git filter-repo --force \
            --name-callback 'return b"LenuxFPV"' \
            --email-callback 'return b"342138357+lenuxfpv@users.noreply.github.com"' \
            --replace-text ../replacements.txt \
            --replace-message ../replacements.txt
          git push --mirror "https://x-access-token:${DEST_TOKEN}@github.com/lenuxfpv/fpv-dvr-lap-timer.git"
 
