name: Build Windows exe

on:
  workflow_dispatch:          # run by hand from the Actions tab
  push:
    tags: ["v*"]              # e.g. vX.Y.Z (must match VERSION) also publishes a release

permissions:
  contents: write             # needed to attach the exe and installer to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' lap_timer.py)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ${{ steps.ver.outputs.version }} in lap_timer.py"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip PyQt6 pyinstaller

      - name: Stamp version into the exe
        run: python make_version_file.py

      # Same options as build_windows.bat. ffmpeg is not bundled: the app finds one in
      # a "bin" folder next to the exe or on PATH.
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name FPVDVRLapTimer --icon fpv-dvr-lap-timer.ico --add-data "fpv-dvr-lap-timer.ico;." --version-file version_info.txt lap_timer.py

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $env:FPV_LAP_TIMER_DB = Join-Path $env:RUNNER_TEMP "smoke.db"
          $p = Start-Process dist\FPVDVRLapTimer.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "FPVDVRLapTimer.exe exited with code $($p.ExitCode)" }
          $p.Kill()
          $v = (Get-Item dist\FPVDVRLapTimer.exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion: $v"
          if ($v -ne "${{ steps.ver.outputs.version }}") { throw "exe version '$v' != ${{ steps.ver.outputs.version }}" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Test installer (silent install, Apps entry, uninstall)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "fpv-install"
          Start-Process dist\FPVDVRLapTimer-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          if (-not (Test-Path "$dir\FPVDVRLapTimer.exe")) { throw "installer did not copy FPVDVRLapTimer.exe" }
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $entry = Get-ChildItem $uninst | Get-ItemProperty | Where-Object { $_.DisplayName -like "FPV DVR Lap Timer*" }
          if (-not $entry) { throw "no Settings > Apps entry was created" }
          Write-Host "Apps entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          if ($entry.DisplayVersion -ne "${{ steps.ver.outputs.version }}") { throw "Apps entry version $($entry.DisplayVersion) != ${{ steps.ver.outputs.version }}" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\FPVDVRLapTimer.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\FPVDVRLapTimer.exe") { throw "uninstall left FPVDVRLapTimer.exe behind" }
          if (Get-ChildItem $uninst | Get-ItemProperty | Where-Object { $_.DisplayName -like "FPV DVR Lap Timer*" }) { throw "uninstall left the Apps entry behind" }

      - uses: actions/upload-artifact@v7
        with:
          name: FPVDVRLapTimer-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/FPVDVRLapTimer.exe
            dist/FPVDVRLapTimer-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/FPVDVRLapTimer.exe
            dist/FPVDVRLapTimer-Setup.exe
