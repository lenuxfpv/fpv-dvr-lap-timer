name: Build Windows exe

on:
  workflow_dispatch:          # run by hand from the Actions tab
  push:
    tags: ["v*"]              # e.g. v1.1.0 also publishes a GitHub release

permissions:
  contents: write             # needed to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re;print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"',open('lap_timer.py').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ${{ steps.ver.outputs.version }} in lap_timer.py"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip PyQt6 pyinstaller

      - name: Stamp version into the exe
        run: python make_version_file.py

      # Same options as build_windows.bat. ffmpeg is not bundled: the app finds one in
      # a "bin" folder next to the exe or on PATH.
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name FPVLapTimer --icon fpv-lap-timer.ico --version-file version_info.txt lap_timer.py

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $env:FPV_LAP_TIMER_DB = Join-Path $env:RUNNER_TEMP "smoke.db"
          $p = Start-Process dist\FPVLapTimer.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "FPVLapTimer.exe exited with code $($p.ExitCode)" }
          $p.Kill()
          $v = (Get-Item dist\FPVLapTimer.exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion: $v"
          if ($v -ne "${{ steps.ver.outputs.version }}") { throw "exe version '$v' != ${{ steps.ver.outputs.version }}" }

      - uses: actions/upload-artifact@v4
        with:
          name: FPVLapTimer-${{ steps.ver.outputs.version }}-windows
          path: dist/FPVLapTimer.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FPVLapTimer.exe
